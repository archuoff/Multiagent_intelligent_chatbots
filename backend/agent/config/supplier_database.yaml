# agents/configs/supplier_database.yaml

# --- identity ---
agent_id: supplier_database        # unique key, used in URLs (/chat/supplier_database),
                                    # file naming, and config lookups. lowercase, underscores.
name: "Supplier Database"          # human-readable name, shown to users and used in
                                    # generated messages (e.g. "That's outside what
                                    # Supplier Database can help with...")

# --- used by classify_intent's prompt template ---
domain_description: >
  supplier lead times, part sourcing history, supplier performance
  scorecards, and contract/pricing lookups across JLR's supplier network

# --- the agent's actual persona/behavior prompt (used by generate_answer, not classify_intent) ---
system_prompt: >
  You are the Supplier Database assistant. Help engineers and procurement
  staff look up supplier information accurately. Always cite the source
  document. Never guess at pricing, lead times, or contract terms —
  if it's not in the retrieved context, say so and suggest they escalate
  to procurement directly.

# --- which shared tools this agent is allowed to use (from core/tool_registry.py) ---
tools:
  - search_knowledge_base
  - get_crm_contact

# --- where this agent's data lives ---
data_sources:
  vector_db: supplier_kb           # its isolated Chroma/Qdrant collection name

# --- model + generation settings ---
model: claude-sonnet-4-6
max_tokens: 1024
temperature: 0.3                   # lower = more precise/less creative, fitting for
                                    # a data-lookup agent vs. a conversational one

# --- query pipeline settings ---
confidence_threshold: 0.75         # step 11 gate — how confident before it can
                                    # respond without escalating to an SME
escalation_sla_seconds: 900        # how long to wait for SME response before
                                    # falling back to the low-confidence draft