<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JLR Knowledge Platform</title>
<style>
  :root {
    --navy: #0b1526;
    --navy-2: #101c33;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ink: #101828;
    --muted: #667085;
    --muted-2: #98a2b3;
    --border: #e4e7ec;
    --page-bg: #f5f6f8;
    --card-bg: #ffffff;
    --danger: #d92d20;
    --danger-bg: #fef3f2;
    --danger-border: #fda29b;
    --success: #12b76a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar (persistent) ---------- */
  .topbar {
    background: var(--navy);
    color: #fff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: 0 1px 0 rgba(255,255,255,0.06);
  }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #60a5fa);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0;
  }
  .brand .titles h1 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: 0.1px; }
  .brand .titles p { margin: 0; font-size: 11.5px; color: #94a3b8; }

  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .conn-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #cbd5e1; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #667085; flex-shrink: 0; }
  .dot.ok { background: var(--success); }
  .dot.bad { background: var(--danger); }
  .settings-toggle {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e4e7ec;
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 7px;
    cursor: pointer;
  }
  .settings-toggle:hover { background: rgba(255,255,255,0.12); }
  .settings-panel {
    position: absolute;
    top: 56px;
    right: 28px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(16,24,40,0.16);
    padding: 14px 16px;
    width: 260px;
    display: none;
    z-index: 20;
  }
  .settings-panel.open { display: block; }
  .settings-panel label {
    display: block; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px;
  }
  .settings-panel input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 7px; font-size: 12.5px; color: var(--ink);
  }
  .settings-panel input:focus { outline: none; border-color: var(--accent); }

  /* ---------- Landing view ---------- */
  #landingView {
    flex: 1;
    overflow-y: auto;
    padding: 56px 24px 40px;
  }
  .landing-inner { max-width: 1080px; margin: 0 auto; }
  .landing-hero { text-align: center; margin-bottom: 40px; }
  .landing-hero h2 { font-size: 27px; margin: 0 0 8px; font-weight: 650; letter-spacing: -0.3px; }
  .landing-hero p { font-size: 14.5px; color: var(--muted); margin: 0; }

  .agent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
  }
  .agent-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 22px 20px;
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    display: flex;
    flex-direction: column;
    min-height: 168px;
  }
  .agent-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(16,24,40,0.10);
    border-color: #c7d2fe;
  }
  .agent-avatar {
    width: 42px; height: 42px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff;
    margin-bottom: 14px;
  }
  .agent-card h3 { margin: 0 0 6px; font-size: 15.5px; font-weight: 650; line-height: 1.3; }
  .agent-card p {
    margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    flex: 1;
  }
  .agent-card .cta {
    margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--accent);
    display: flex; align-items: center; gap: 4px;
  }

  .landing-status {
    text-align: center; color: var(--muted); font-size: 13.5px; padding: 40px 0;
  }
  .retry-btn {
    margin-top: 12px; padding: 8px 16px; background: var(--navy); color: #fff;
    border: none; border-radius: 7px; cursor: pointer; font-size: 12.5px;
  }

  /* ---------- Chat view ---------- */
  #chatView { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #chatView.open { display: flex; }

  .chat-header {
    padding: 16px 28px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .back-btn {
    background: #f2f4f7; border: 1px solid var(--border); color: var(--ink);
    font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 8px;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; gap: 5px;
  }
  .back-btn:hover { background: #e4e7ec; }
  .chat-header .agent-avatar { width: 34px; height: 34px; font-size: 13px; border-radius: 9px; margin: 0; flex-shrink: 0; }
  .chat-header-titles h2 { margin: 0; font-size: 15.5px; font-weight: 650; }
  .chat-header-titles p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px 20px;
  }
  .messages-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .empty-state { margin: auto; text-align: center; color: var(--muted); max-width: 380px; padding: 60px 0; }
  .empty-state h3 { color: var(--ink); font-size: 15px; margin-bottom: 6px; }
  .empty-state p { font-size: 13px; line-height: 1.5; }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .bubble-user {
    max-width: 75%;
    background: var(--accent);
    color: #fff;
    padding: 11px 16px;
    border-radius: 16px;
    border-bottom-right-radius: 4px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .answer-card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 19px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .answer-card .answer-text {
    font-size: 14px; line-height: 1.65; color: var(--ink); white-space: pre-wrap;
  }
  .answer-card.error-card {
    background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger);
  }
  .answer-card.error-card .answer-text { color: var(--danger); }

  .sources {
    margin-top: 14px;
    padding-top: 13px;
    border-top: 1px solid #eef0f3;
  }
  .sources-title {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted-2); margin-bottom: 8px; font-weight: 700;
  }
  .source-item {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12.5px; color: #344054; padding: 6px 0;
    border-bottom: 1px solid #f5f6f8;
  }
  .source-item:last-child { border-bottom: none; }
  .source-item .src-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item .src-title { font-weight: 600; }
  .source-item .src-loc { color: var(--muted); }

  .typing-dots { display: flex; gap: 4px; align-items: center; padding: 3px 0; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: #98a2b3;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .composer-wrap {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 16px 24px 22px;
    flex-shrink: 0;
  }
  .composer {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 14px;
    font-family: inherit;
    height: 48px;
    max-height: 140px;
    background: #fbfbfc;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 24px;
    height: 48px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease;
    flex-shrink: 0;
  }
  .composer button:hover:not(:disabled) { background: var(--accent-dark); }
  .composer button:disabled { background: #98a2b3; cursor: not-allowed; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandHome">
    <div class="mark">JLR</div>
    <div class="titles">
      <h1>JLR Knowledge Platform</h1>
      <p>Multi-agent assistant</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="conn-status"><span id="connDot" class="dot"></span><span id="connText">Connecting&hellip;</span></div>
    <button class="settings-toggle" id="settingsToggle">Settings</button>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <label for="apiBase">Backend URL</label>
    <input id="apiBase" type="text" value="http://localhost:8000" />
  </div>
</div>

<div id="landingView">
  <div class="landing-inner">
    <div class="landing-hero">
      <h2>Choose an assistant to get started</h2>
      <p>Ask a domain question and get a real, source-cited answer from your knowledge base.</p>
    </div>
    <div id="agentGrid" class="agent-grid"></div>
  </div>
</div>

<div id="chatView">
  <div class="chat-header">
    <button class="back-btn" id="backBtn">&larr; All agents</button>
    <div class="agent-avatar" id="chatAvatar"></div>
    <div class="chat-header-titles">
      <h2 id="chatAgentName"></h2>
      <p id="chatAgentDesc"></p>
    </div>
  </div>
  <div id="messages" class="messages">
    <div class="messages-inner" id="messagesInner"></div>
  </div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="messageInput" placeholder="Ask a question..."></textarea>
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const AVATAR_PALETTE = ["#2563eb", "#7c3aed", "#0891b2", "#c2410c", "#059669", "#be185d"];

  const state = {
    agents: [],
    activeAgentId: null,
    history: {},
    sessionId: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
  };

  const el = {
    apiBase: document.getElementById("apiBase"),
    connDot: document.getElementById("connDot"),
    connText: document.getElementById("connText"),
    settingsToggle: document.getElementById("settingsToggle"),
    settingsPanel: document.getElementById("settingsPanel"),
    agentGrid: document.getElementById("agentGrid"),
    landingView: document.getElementById("landingView"),
    chatView: document.getElementById("chatView"),
    chatAvatar: document.getElementById("chatAvatar"),
    chatAgentName: document.getElementById("chatAgentName"),
    chatAgentDesc: document.getElementById("chatAgentDesc"),
    messagesInner: document.getElementById("messagesInner"),
    messages: document.getElementById("messages"),
    messageInput: document.getElementById("messageInput"),
    sendBtn: document.getElementById("sendBtn"),
    backBtn: document.getElementById("backBtn"),
    brandHome: document.getElementById("brandHome"),
  };

  function apiBase() {
    return el.apiBase.value.trim().replace(/\/+$/, "");
  }

  function setConnection(ok, label) {
    el.connDot.className = "dot " + (ok ? "ok" : "bad");
    el.connText.textContent = label;
  }

  function initials(name) {
    const words = (name || "").trim().split(/\s+/).filter(Boolean);
    if (words.length === 0) return "?";
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function avatarColor(agentId) {
    let hash = 0;
    for (let i = 0; i < agentId.length; i++) hash = (hash * 31 + agentId.charCodeAt(i)) >>> 0;
    return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
  }

  async function loadAgents() {
    setConnection(false, "Connecting...");
    try {
      const response = await fetch(apiBase() + "/agents");
      if (!response.ok) throw new Error("HTTP " + response.status);
      const agents = await response.json();
      state.agents = agents;
      renderAgentGrid();
      setConnection(true, "Connected (" + agents.length + " agent" + (agents.length === 1 ? "" : "s") + ")");
    } catch (error) {
      state.agents = [];
      el.agentGrid.innerHTML =
        '<div class="landing-status" style="grid-column: 1 / -1;">' +
        "Could not reach the backend at this URL.<br/>Confirm the API is running and the URL in Settings is correct." +
        '<br/><button class="retry-btn" id="retryBtn">Retry</button></div>';
      document.getElementById("retryBtn").addEventListener("click", loadAgents);
      setConnection(false, "Disconnected");
    }
  }

  function renderAgentGrid() {
    el.agentGrid.innerHTML = "";
    state.agents.forEach((agent) => {
      const description = agent.domain_description && agent.domain_description !== agent.display_name
        ? agent.domain_description
        : "Ask this assistant about its domain knowledge base.";
      const card = document.createElement("div");
      card.className = "agent-card";
      card.innerHTML =
        '<div class="agent-avatar" style="background:' + avatarColor(agent.agent_id) + '">' + escapeHtml(initials(agent.display_name)) + "</div>" +
        "<h3>" + escapeHtml(agent.display_name) + "</h3>" +
        "<p>" + escapeHtml(description) + "</p>" +
        '<div class="cta">Open assistant &rarr;</div>';
      card.addEventListener("click", () => openChat(agent.agent_id));
      el.agentGrid.appendChild(card);
    });
  }

  function openChat(agentId) {
    state.activeAgentId = agentId;
    if (!state.history[agentId]) state.history[agentId] = [];
    const agent = state.agents.find((item) => item.agent_id === agentId);
    const description = agent && agent.domain_description && agent.domain_description !== agent.display_name
      ? agent.domain_description
      : "";
    el.chatAgentName.textContent = agent ? agent.display_name : agentId;
    el.chatAgentDesc.textContent = description;
    el.chatAvatar.textContent = initials(agent ? agent.display_name : agentId);
    el.chatAvatar.style.background = avatarColor(agentId);

    el.landingView.style.display = "none";
    el.chatView.classList.add("open");
    renderMessages();
    el.messageInput.value = "";
    el.messageInput.focus();
  }

  function closeChat() {
    state.activeAgentId = null;
    el.chatView.classList.remove("open");
    el.landingView.style.display = "";
  }

  function renderMessages() {
    const history = state.history[state.activeAgentId] || [];
    if (history.length === 0) {
      el.messagesInner.innerHTML =
        '<div class="empty-state"><h3>Ask ' + escapeHtml(el.chatAgentName.textContent) + " something</h3>" +
        "<p>Answers are generated live from your ingested documents, with citations back to the source.</p></div>";
      return;
    }
    el.messagesInner.innerHTML = "";
    history.forEach((message) => appendMessageNode(message));
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function appendMessageNode(message) {
    const row = document.createElement("div");

    if (message.role === "user") {
      row.className = "msg-row user";
      const bubble = document.createElement("div");
      bubble.className = "bubble-user";
      bubble.textContent = message.content;
      row.appendChild(bubble);
      el.messagesInner.appendChild(row);
      return row;
    }

    row.className = "msg-row assistant";
    const card = document.createElement("div");
    card.className = "answer-card" + (message.role === "error" ? " error-card" : "");
    const text = document.createElement("div");
    text.className = "answer-text";
    text.textContent = message.content;
    card.appendChild(text);

    const sources = dedupeSources(message.sources);
    if (sources.length > 0) {
      const sourcesBlock = document.createElement("div");
      sourcesBlock.className = "sources";
      const title = document.createElement("div");
      title.className = "sources-title";
      title.textContent = "Sources";
      sourcesBlock.appendChild(title);
      sources.forEach((source) => {
        const item = document.createElement("div");
        item.className = "source-item";
        item.innerHTML =
          '<span class="src-dot"></span><span><span class="src-title">' +
          escapeHtml(source.document_title || source.document_id || "Untitled source") + "</span>" +
          (source.location ? '<span class="src-loc"> &middot; ' + escapeHtml(source.location) + "</span>" : "") +
          "</span>";
        sourcesBlock.appendChild(item);
      });
      card.appendChild(sourcesBlock);
    }

    row.appendChild(card);
    el.messagesInner.appendChild(row);
    return row;
  }

  function dedupeSources(sources) {
    if (!sources) return [];
    const seen = new Set();
    const unique = [];
    sources.forEach((source) => {
      const key = (source.document_title || source.document_id || "") + "|" + (source.location || "");
      if (seen.has(key)) return;
      seen.add(key);
      unique.push(source);
    });
    return unique;
  }

  function citationLocation(citation) {
    if (!citation) return "";
    if (citation.page_number != null) return "page " + citation.page_number;
    if (citation.sheet_name) return "sheet " + citation.sheet_name;
    if (citation.slide_number != null) return "slide " + citation.slide_number;
    return "";
  }

  async function sendMessage() {
    const text = el.messageInput.value.trim();
    if (!text || !state.activeAgentId) return;

    const history = state.history[state.activeAgentId];
    history.push({ role: "user", content: text });
    el.messageInput.value = "";
    renderMessages();

    const typingRow = appendTypingIndicator();
    el.sendBtn.disabled = true;
    el.messageInput.disabled = true;

    try {
      const response = await fetch(apiBase() + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent_id: state.activeAgentId,
          message: text,
          session_id: state.sessionId,
          conversation_history: history
            .filter((item) => item.role === "user" || item.role === "assistant")
            .map((item) => ({ role: item.role, content: item.content }))
            .slice(-10),
        }),
      });

      typingRow.remove();

      if (!response.ok) {
        const detail = await safeErrorDetail(response);
        history.push({ role: "error", content: "Request failed (" + response.status + "): " + detail });
        renderMessages();
        return;
      }

      const data = await response.json();
      const sources = (data.retrieved_context || []).map((context) => ({
        document_title: context.document_title,
        document_id: context.citation ? context.citation.document_id : null,
        location: citationLocation(context.citation),
      }));

      history.push({ role: "assistant", content: data.answer, sources: sources });
      renderMessages();
    } catch (error) {
      typingRow.remove();
      history.push({ role: "error", content: "Could not reach the backend: " + error.message });
      renderMessages();
    } finally {
      el.sendBtn.disabled = false;
      el.messageInput.disabled = false;
      el.messageInput.focus();
    }
  }

  async function safeErrorDetail(response) {
    try {
      const body = await response.json();
      return body.detail || JSON.stringify(body);
    } catch (error) {
      return response.statusText || "unknown error";
    }
  }

  function appendTypingIndicator() {
    const row = document.createElement("div");
    row.className = "msg-row assistant";
    row.innerHTML = '<div class="answer-card"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    el.messagesInner.appendChild(row);
    el.messages.scrollTop = el.messages.scrollHeight;
    return row;
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value == null ? "" : String(value);
    return div.innerHTML;
  }

  el.sendBtn.addEventListener("click", sendMessage);
  el.messageInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
  el.apiBase.addEventListener("change", loadAgents);
  el.backBtn.addEventListener("click", closeChat);
  el.brandHome.addEventListener("click", closeChat);
  el.settingsToggle.addEventListener("click", () => {
    el.settingsPanel.classList.toggle("open");
  });
  document.addEventListener("click", (event) => {
    if (!el.settingsPanel.contains(event.target) && event.target !== el.settingsToggle) {
      el.settingsPanel.classList.remove("open");
    }
  });

  loadAgents();
})();
</script>
</body>
</html>
